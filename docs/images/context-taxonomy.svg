<svg viewBox="0 0 1360 762" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Executive function across human and AI</title>
<desc id="d">Human side: shared, individual and working-session tracking, with the context held at shared and individual level. AI side: a session replay loop — one of several that may be running — with sub-agents, tools and API calls beneath it, fed automatically by four context stores, and promoting back out into them with a human in the loop. Six content types are colour-keyed across both sides to show what must be kept in sync. Small arrows mark the promotion cascade from project reference up to general reference up to working standards; templates sits outside it.</desc>
